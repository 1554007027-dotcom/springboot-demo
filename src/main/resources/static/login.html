<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 380px;
        }
        h2 { text-align: center; margin-bottom: 30px; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #667eea; }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #5568d3; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        .error { color: #e74c3c; font-size: 14px; margin-top: 10px; min-height: 20px; }
        .success { color: #27ae60; }
    </style>
</head>
<body>
<div class="card">
    <h2>用户管理系统</h2>
    <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" value="admin">
    </div>
    <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" value="123456">
    </div>
    <button id="loginBtn" onclick="login()">登 录</button>
    <div class="error" id="errorMsg"></div>
</div>

<script>
    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        errorMsg.textContent = '';

        if (!username || !password) {
            errorMsg.textContent = '用户名和密码不能为空';
            return;
        }

        btn.disabled = true;
        btn.textContent = '登录中...';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (data.code === 200) {
                // 保存 token 到 localStorage
                localStorage.setItem('accessToken', data.data.accessToken);
                localStorage.setItem('refreshToken', data.data.refreshToken);
                localStorage.setItem('username', data.data.username);

                errorMsg.textContent = '登录成功，跳转中...';
                errorMsg.className = 'error success';

                setTimeout(() => {
                    window.location.href = '/users.html';
                }, 500);
            } else {
                errorMsg.textContent = data.message || '登录失败';
            }
        } catch (e) {
            errorMsg.textContent = '网络错误：' + e.message;
        } finally {
            btn.disabled = false;
            btn.textContent = '登 录';
        }
    }

    // 回车键登录
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>
